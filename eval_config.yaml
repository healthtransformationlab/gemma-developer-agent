# Per-task budgets the evaluator reads from the submission (rulebook §7.1). The whole run has 12 hours for
# ~120 tasks including sandbox setup, so about 5 minutes of agent time per task is the real ceiling.
# The sample submission used 1 minute and 10 calls and produced NO_PATCH twice (starter notebook).
evaluation:
  timeout_seconds: 120          # per command
  max_tool_calls: 40
  max_time_minutes: 5.0
  max_turns: 60
