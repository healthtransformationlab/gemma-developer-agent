# Per-task limits the evaluator reads from the submission (starter notebook, cell 5). The sample agent
# spent its whole tool budget reading files and never called submit_patch: NO_PATCH on both tasks. These
# limits exist so the agent always has budget left to submit.
evaluation:
  timeout_seconds: 300              # agent phase per task
  verification_timeout_seconds: 300 # test phase per task
  max_tool_calls: 40
  max_time_minutes: 8.0
  max_turns: 40
