# Per-task budgets the evaluator reads from the submission (rulebook §7.1). 31B-b (#136): the public "Budget-Fit
# Single Agent" budget for the 31B, which several teams scored normally (about 0.20 to 0.24): 8 minutes, 28 calls,
# 80 turns, 300-second commands. One team measured about 225 s a task on the scorer's 4xL4 including setup, so
# about 7.5 hours for 120 tasks, inside the 12-hour limit. The 31B entry (#124) kept E4B's 5 minutes and 40 calls.
# 31B-d2-5m (#161): our 31B timing run (nlp #821) averaged 357 s a task at 8 minutes, past 12 hours for 120 tasks, so
# the per-task time is 5 minutes; calls and turns stay.
# 31B-e (#172): 31B-d2-5m plus find.py --tests (#170) and 36 calls; the 5-minute cap still bounds every task.
evaluation:
  timeout_seconds: 120          # per command (#161: one command may not take most of a 5-minute task)
  max_tool_calls: 36            # 31B-e (#172): 15 of 23 dev tasks of 31B-d2 ended at 27-28 of 28 calls
  max_time_minutes: 8.0         # 31B-e8 (#173): the public bundle's cap; dev tasks averaged 209 s at 8 minutes, and at 5 minutes 13 of 33 hit the limit
  max_turns: 80
