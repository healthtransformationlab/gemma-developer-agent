# Freeze the paper as submitted (#93, docs/adr/0001-freeze-the-submitted-paper.md): at one commit of main, the tag
# paper-v<n>, a GitHub release of that tag with the paper's PDF, and the branch release/paper-track moved forward to
# the same commit. Run by hand: Actions -> Release the paper -> Run workflow. Running it again with the same inputs
# writes the release's notes and file again and changes nothing else.
name: Release the paper
on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag to make: paper-v<n>, e.g. paper-v14"
        required: true
      target_sha:
        description: "Full SHA of the commit on main that holds the paper as submitted"
        required: true
      source_sha:
        description: "Full SHA of the source repository (health-transformation-lab-nlp) at the time; empty leaves it out of the notes"
        required: false
        default: ""
permissions:
  contents: write            # the tag, the release and the branch; nothing else
concurrency:
  group: release-the-paper
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAG: ${{ inputs.tag_name }}
      SHA: ${{ inputs.target_sha }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      BRANCH: release/paper-track
      PDF: paper/small-local-agent-redo-cloud-agent-work.pdf
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check the settings before doing work
        run: |
          [[ "$TAG" =~ ^paper-v[0-9]+$ ]] || { echo "::error::tag_name must look like paper-v14; got '$TAG'"; exit 1; }
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::target_sha must be a full 40-character commit SHA"; exit 1; }
          [[ -z "$SOURCE_SHA" || "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::source_sha must be empty or a full 40-character commit SHA"; exit 1; }
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 0
      - name: The commit is on main, and the tag is not already somewhere else
        run: |
          git fetch --quiet --tags origin main
          git merge-base --is-ancestor "$SHA" origin/main || { echo "::error::$SHA is not a commit of main"; exit 1; }
          at=$(git rev-parse --quiet --verify "refs/tags/$TAG^{commit}" || true)
          [[ -z "$at" || "$at" == "$SHA" ]] || { echo "::error::tag $TAG already exists, at $at"; exit 1; }
          test -s "$PDF" || { echo "::error::no $PDF at $SHA"; exit 1; }
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - name: The paper at this commit passes the competition's rules
        run: |
          pip install --quiet "pypdf==6.1.3"
          python paper/check_rules.py --check
      - name: Tag and release
        run: |
          version="${TAG#paper-v}"
          title="The paper as submitted: version $version"
          repo="https://github.com/$GITHUB_REPOSITORY"
          source="https://github.com/healthtransformationlab/health-transformation-lab-nlp"
          {
            echo "\"Can a small local agent redo a cloud agent's work?\", as submitted to the Gemma 4 Developer Agent Competition, Paper Track."
            echo
            echo "- **The paper:** the PDF attached below (six pages). Its text, where each number comes from and the check against the competition's rules are in [\`paper/\`]($repo/tree/$TAG/paper) at this tag."
            echo "- **This commit:** \`$SHA\`. The branch [\`$BRANCH\`]($repo/tree/$BRANCH) points at the latest version released this way; \`main\` moves on."
            echo "- **The tasks (CC BY 4.0):** <https://www.kaggle.com/datasets/jcblearning/health-transformation-lab-coding-agent-tasks>"
            if [[ -n "$SOURCE_SHA" ]]; then
              echo "- **Harness, builders and run tables (Apache 2.0):** the source repository at [\`${SOURCE_SHA:0:7}\`]($source/tree/$SOURCE_SHA)."
            else
              echo "- **Harness, builders and run tables (Apache 2.0):** <$source>"
            fi
            echo
            echo "A personal learning project, not affiliated with or endorsed by any employer, institution or vendor. Every patient record in the source repository is synthetic."
          } > "$RUNNER_TEMP/notes.md"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "$title" --notes-file "$RUNNER_TEMP/notes.md"
            gh release upload "$TAG" "$PDF" --clobber
          else
            gh release create "$TAG" --target "$SHA" --title "$title" --notes-file "$RUNNER_TEMP/notes.md" "$PDF"
          fi
          gh release view "$TAG" --json tagName,url,assets --jq '{tagName, url, assets: [.assets[].name]}'
      - name: Move the branch forward to the same commit
        run: |
          git push origin "$SHA:refs/heads/$BRANCH"
          echo "$BRANCH is at $(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)"
