# The submission's prompt and files (#97): tests/test_submission.py on every change to the submission.
name: Submission check
on:
  pull_request:
    paths: ["agent.yaml", "eval_config.yaml", "prompts/**", "configs/**", "sub_agents/**", "skills/**", "tests/**",
            ".github/workflows/submission-check.yml"]
  push:
    branches: [main]
    paths: ["agent.yaml", "eval_config.yaml", "prompts/**", "configs/**", "sub_agents/**", "skills/**", "tests/**"]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install --quiet "pytest==8.4.2" "pyyaml==6.0.3"
      - run: python -m pytest -q tests
