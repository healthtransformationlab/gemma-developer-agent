# Rulebook §2.4 and §10: a bounded thinking budget with include_thoughts keeps <|tool_call> from being cut
# off by a long thought block; max_output_tokens leaves room for an edit_file payload (8,192 after thinking) and
# keeps 12,288 of the server's 32,768-token window, so the conversation gets 20,480 (issue 99: at 16,384, a fifth
# of the runs ended with ContextWindowExceededError; issue 105: at 8,192 an edit was cut off, and the largest
# prompt seen was 17,426 tokens).
temperature: 0.2
top_p: 0.95
max_output_tokens: 12288
thinking_config:
  thinking_budget: 4096
  include_thoughts: true
