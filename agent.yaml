# Root agent config for the Gemma 4 Developer Agent Competition (Google ADK Agent Config).
# Every agent and subagent uses the same base model; LoRA adapters are optional per agent.
# Small-model bonus eligibility: gemma-4-e4b-it-qat-w4a16-ct (switch to 31b for the main-track-only run).
name: data_pipeline_fixer
model: gemma-4-e4b-it-qat-w4a16-ct
description: Fixes issues in data-pipeline repositories by reading the repository's own metadata tables before its logs.
instruction: !include prompts/system.md
generate_content_config: !include configs/sampling.yaml
tools:
  - run_command
  - read_file
  - edit_file
  - write_file
  - get_status
  - submit_patch
  - get_code_neighbors
  - search_similar_code
  - get_code_subgraph
skills:
  - skills/pipeline-doctor
sub_agents:
  - !include sub_agents/code_analyzer.yaml
